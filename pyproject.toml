[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "captcha-crack"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "click>=8.1",
]

[project.optional-dependencies]
tesseract = ["pytesseract>=0.3.10"]
aws = ["boto3>=1.34"]
google = ["google-cloud-aiplatform>=1.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
captcha-crack = "captcha_crack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.hatch.build.targets.wheel]
packages = ["src/captcha_crack"]
